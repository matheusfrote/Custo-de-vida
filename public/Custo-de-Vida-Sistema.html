<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Custo de Vida - Aplicativo do Sistema</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --bg-dark: #020617;
      --card-bg: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 460px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: #fff;
    }
    p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(16, 185, 129, 0.2);
      color: var(--primary);
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .calc-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: #020617;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      background: var(--primary);
      color: #020617;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .btn:hover {
      background: #34d399;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .result {
      margin-top: 14px;
      padding: 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      display: none;
    }
    .result-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
    }
    .footer {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">⏳</div>
    <span class="badge">Aplicativo Offline Instalado</span>
    <h1>Custo de Vida</h1>
    <p>Converta o preço de qualquer produto em horas e dias da sua vida trabalhando.</p>

    <!-- Quick Offline Calculator -->
    <div class="calc-box">
      <div class="input-group">
        <label for="netSalary">Seu Salário Líquido Mensal (R$)</label>
        <input type="number" id="netSalary" value="3500" placeholder="ex: 3500">
      </div>
      <div class="input-group">
        <label for="weeklyHours">Horas Trabalhadas por Semana</label>
        <input type="number" id="weeklyHours" value="40" placeholder="ex: 40">
      </div>
      <div class="input-group" style="margin-bottom: 0;">
        <label for="productPrice">Preço do Produto / Desejo (R$)</label>
        <input type="number" id="productPrice" placeholder="ex: 450" value="450">
      </div>

      <div id="resultBox" class="result">
        <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase;">Tempo de Vida Necessário:</div>
        <div id="resultText" class="result-value">0h 00m</div>
        <div id="resultDays" style="font-size: 0.8rem; color: #cbd5e1; margin-top: 4px;"></div>
      </div>
    </div>

    <button type="button" class="btn" onclick="calculateOffline()">
      ⚡ Calcular Horas de Trabalho
    </button>

    <button type="button" class="btn btn-secondary" onclick="openOnlineApp()">
      🌐 Acessar Sistema Completo
    </button>

    <div class="footer">
      Sistema executando localmente sem necessidade de internet.
    </div>
  </div>

  <script>
    function calculateOffline() {
      const salary = parseFloat(document.getElementById('netSalary').value) || 0;
      const weeklyHours = parseFloat(document.getElementById('weeklyHours').value) || 40;
      const price = parseFloat(document.getElementById('productPrice').value) || 0;

      if (salary <= 0 || price <= 0) {
        alert('Por favor informe o salário e o valor do produto.');
        return;
      }

      // CLT standard divisor calculation: weeklyHours * 5
      const monthlyHours = weeklyHours * 5;
      const hourlyRate = salary / monthlyHours;
      const totalHours = price / hourlyRate;

      const wholeHours = Math.floor(totalHours);
      const minutes = Math.round((totalHours - wholeHours) * 60);
      const hoursPerDay = weeklyHours / 5;
      const workDays = (totalHours / hoursPerDay).toFixed(1);

      document.getElementById('resultText').textContent = wholeHours + 'h ' + (minutes < 10 ? '0' : '') + minutes + 'min de trabalho';
      document.getElementById('resultDays').textContent = 'Equivale a aproximadamente ' + workDays + ' dia(s) úteis de expediente.';
      document.getElementById('resultBox').style.display = 'block';
    }

    function openOnlineApp() {
      window.location.href = window.location.origin + '/';
    }

    // Auto-calculate on load
    window.addEventListener('DOMContentLoaded', calculateOffline);
  </script>
</body>
</html>
